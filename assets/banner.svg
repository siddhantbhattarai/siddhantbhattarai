      <text y="316" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
            font-size="17.5" fill="#D3E1F2" opacity="0.95">
        Securing Systems &#160;|&#160; Automating DevSecOps Pipelines
        <animate attributeName="opacity" values="0;0;0.95" keyTimes="0;0.5;1" dur="1.8s" begin="0s" fill="freeze"/>
      </text>
      <text y="342" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
            font-size="17.5" fill="#D3E1F2" opacity="0.95">
        Empowering AI-Driven Threat Detection
        <animate attributeName="opacity" values="0;0;0.95" keyTimes="0;0.561;1" dur="2.05s" begin="0s" fill="freeze"/>
      </text>
    </g>

    <!-- ── right divider ──────────────────────────────── -->
    <g stroke="#38BDF8" stroke-opacity="0.75">
      <line x1="898" y1="86" x2="898" y2="330" stroke-width="1.6"/>
    </g>
    <circle cx="898" cy="86"  r="4" fill="#38BDF8"/>
    <circle cx="898" cy="330" r="4" fill="#38BDF8"/>

    <!-- ── four pillars ───────────────────────────────── -->
    <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#E4EEF9">

      <!-- 1 · Cyber Security -->
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.684;1" dur="1.9s" begin="0s" fill="freeze"/>
        <g transform="translate(934,96)" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 2.375 L33.5 8.375 V20.375 C33.5 29.375 27.5 34.625 20 37.625 C12.5 34.625 6.5 29.375 6.5 20.375 V8.375 Z"/><rect x="14" y="16.625" width="12" height="10.5" rx="1.875"/><path d="M16.25 16.625 v-3 a3.75 3.75 0 0 1 7.5 0 v3"/>
        </g>
        <text x="986" y="122">Cyber Security</text>
      </g>

      <!-- 2 · DevSecOps -->
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.714;1" dur="2.1s" begin="0s" fill="freeze"/>
        <g transform="translate(934,157)" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20 C16 12.5 11 10 8.5 10 C4 10 3 14.5 3 20 C3 25.5 4 30 8.5 30 C11 30 16 27.5 20 20 C24 12.5 29 10 31.5 10 C36 10 37 14.5 37 20 C37 25.5 36 30 31.5 30 C29 30 24 27.5 20 20 Z"/>
        </g>
        <text x="986" y="183">DevSecOps</text>
      </g>

      <!-- 3 · AI &amp; ML Security -->
      <g opacity="1">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.739;1" dur="2.3s" begin="0s" fill="freeze"/>
        <g transform="translate(934,218)" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20 L8 11 M20 20 L8 29 M20 20 L32 11 M20 20 L32 29"/><circle cx="8" cy="11" r="3" fill="#081231"/><circle cx="8" cy="29" r="3" fill="#081231"/><circle cx="32" cy="11" r="3" fill="#081231"/><circle cx="32" cy="29" r="3" fill="#081231"/><circle cx="20" cy="20" r="3.6" fill="#081231"/>
        </g>
        <text x="986" y="244">AI &amp; ML Security</text>
      </g>

      <!-- 4 · Offensive Security -->
      <g opacity="1">
